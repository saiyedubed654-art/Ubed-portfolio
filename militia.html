<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Militia Game</title>
<style>
body{margin:0;background:#87CEEB;overflow:hidden;font-family:sans-serif}
#game{width:100%;height:100vh;background:linear-gradient(#87CEEB,#228B22)}
.player{position:absolute;width:30px;height:40px;background:orange;border-radius:5px}
.enemy{position:absolute;width:30px;height:40px;background:red;border-radius:5px}
.bullet{position:absolute;width:8px;height:4px;background:yellow}
.btn{position:absolute;bottom:20px;width:60px;height:60px;background:#333;color:white;border-radius:50%;font-size:20px}
#fire{right:20px}
#jet{left:20px}
#score{position:absolute;top:10px;left:10px;color:white;font-size:20px}
</style>
</head>
<body>
<div id="game">
  <div id="score">Score: 0</div>
  <div class="player" id="player"></div>
  <button class="btn" id="jet">🚀</button>
  <button class="btn" id="fire">🔫</button>
</div>
<script>
let player = document.getElementById('player');
let score = 0;
let px = 100, py = 300, vy = 0;
let bullets = [];
let enemies = [];

player.style.left = px + 'px';
player.style.top = py + 'px';

// Jetpack
document.getElementById('jet').ontouchstart = () => { vy = -8; }
document.getElementById('jet').ontouchend = () => { vy = 3; }

// Fire
document.getElementById('fire').onclick = () => {
  bullets.push({x:px+30, y:py+20});
}

// Game Loop
setInterval(() => {
  py += vy;
  if(py > 400) py = 400;
  if(py < 0) py = 0;
  player.style.top = py + 'px';

  // bullets
  bullets.forEach(b => b.x += 10);
  bullets = bullets.filter(b => b.x < 400);

  // enemy spawn
  if(Math.random() < 0.03){
    enemies.push({x:400, y:Math.random()*400});
  }
  enemies.forEach(e => e.x -= 3);
  enemies = enemies.filter(e => e.x > 0);

  // draw
  document.querySelectorAll('.bullet,.enemy').forEach(el => el.remove());
  bullets.forEach(b => {
    let d = document.createElement('div');
    d.className = 'bullet';
    d.style.left = b.x + 'px'; d.style.top = b.y + 'px';
    document.getElementById('game').appendChild(d);
  });
  enemies.forEach(e => {
    let d = document.createElement('div');
    d.className = 'enemy';
    d.style.left = e.x + 'px'; d.style.top = e.y + 'px';
    document.getElementById('game').appendChild(d);
  });
}, 30);
</script>
</body>
</html>
