<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mini Militia</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000}
#game{width:100vw;height:100vh;background:linear-gradient(#87CEEB 0%,#228B22 100%);position:relative}
#score{position:absolute;top:10px;left:10px;color:white;font-size:20px;font-weight:bold;z-index:10}
#hp{position:absolute;top:10px;right:10px;color:lime;font-size:20px;font-weight:bold;z-index:10}
.player{position:absolute;width:30px;height:40px;background:orange;border:2px solid white;z-index:5}
.enemy{position:absolute;width:30px;height:40px;background:red;border:2px solid white;z-index:5}
.bullet{position:absolute;width:12px;height:6px;background:yellow;box-shadow:0 0 5px yellow;z-index:4}
.btn{position:absolute;bottom:10vh;width:15vw;height:15vw;max-width:80px;max-height:80px;background:#222;color:white;border:none;border-radius:50%;font-size:30px;z-index:10}
#fire{right:5vw}
#jet{left:5vw}
</style>
</head>
<body>
<div id="game">
  <div id="score">Score: 0</div>
  <div id="hp">HP: 100</div>
  <div class="player" id="player"></div>
  <button class="btn" id="jet">🚀</button>
  <button class="btn" id="fire">🔫</button>
</div>
<script>
let player=document.getElementById('player');
let scoreEl=document.getElementById('score');
let hpEl=document.getElementById('hp');
let game=document.getElementById('game');

let score=0, hp=100, px=50, py=window.innerHeight/2, vy=4;
let bullets=[], enemies=[];

player.style.left=px+'px'; player.style.top=py+'px';

// Mobile touch
document.getElementById('jet').addEventListener('touchstart',()=>{vy=-12;})
document.getElementById('jet').addEventListener('touchend',()=>{vy=4;})
document.getElementById('fire').addEventListener('click',()=>{bullets.push({x:px+30,y:py+17});})

function takkar(a,b){
  return a.x < b.x + 30 && a.x + 30 > b.x && a.y < b.y + 40 && a.y + 40 > b.y;
}

setInterval(()=>{
  // Player
  py+=vy; if(py<0)py=0; if(py>window.innerHeight-50)py=window.innerHeight-50;
  player.style.top=py+'px';

  // Bullets
  bullets.forEach(b=>b.x+=15);
  bullets=bullets.filter(b=>b.x<window.innerWidth);

  // Enemy
  if(Math.random()<0.05){ enemies.push({x:window.innerWidth,y:Math.random()*(window.innerHeight-50)}); }
  enemies.forEach(e=>e.x-=6);

  // GOLI LAGE = SCORE
  for(let i=enemies.length-1;i>=0;i--){
    for(let j=bullets.length-1;j>=0;j--){
      if(takkar(bullets[j], enemies[i])){
        enemies.splice(i,1); bullets.splice(j,1);
        score+=10; scoreEl.innerText='Score: '+score;
        break;
      }
    }
  }

  // DUSHMAN CHUE = HP KAM
  for(let i=enemies.length-1;i>=0;i--){
    if(takkar({x:px,y:py}, enemies[i])){
      enemies.splice(i,1);
      hp-=25; hpEl.innerText='HP: '+hp;
      if(hp<=0){ alert('GAME OVER! Score: '+score); location.reload(); }
    }
  }

  enemies=enemies.filter(e=>e.x>-50);

  // Draw
  document.querySelectorAll('.bullet,.enemy').forEach(el=>el.remove());
  bullets.forEach(b=>{let d=document.createElement('div');d.className='bullet';d.style.left=b.x+'px';d.style.top=b.y+'px';game.appendChild(d);});
  enemies.forEach(e=>{let d=document.createElement('div');d.className='enemy';d.style.left=e.x+'px';d.style.top=e.y+'px';game.appendChild(d);});
},30);
</script>
</body>
</html>
