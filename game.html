 <!DOCTYPE html>
<html>
<head>
<title>Car Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;background:#000;display:flex;justify-content:center;align-items:center;height:100vh}
canvas{background:#222;border:3px solid cyan;margin-top:50px}
#btns{position:absolute;bottom:30px;display:flex;gap:30px}
button{width:70px;height:70px;font-size:30px;border-radius:50%;background:#111;color:cyan;border:2px solid cyan}
#back{position:absolute;top:10px;left:10px;background:cyan;color:#000;padding:10px;text-decoration:none;border-radius:5px;z-index:99;font-weight:bold}
#info{position:absolute;top:10px;width:100%;text-align:center;color:cyan;font-size:18px}
</style>
</head>
<body>
<a id="back" href="index.html">← Back</a>
<div id="info">Score: 0</div>
<canvas id="g" width="300" height="500"></canvas>
<div id="btns"><button onclick="x-=20">←</button><button onclick="x+=20">→</button></div>
<script>
let c=document.getElementById('g').getContext('2d'),x=130,y=420,ex=[60,200],ey=[-100,-300],type=['police','normal'],s=0;
function loop(){
c.clearRect(0,0,300,500);
// road
c.fillStyle='white';for(let i=0;i<500;i+=40)c.fillRect(145,i-s%40,10,20);

c.fillStyle='red';c.fillRect(x,y,40,80); // Tumhari car
for(let i=0;i<2;i++){
ey[i]+=4;
if(ey[i]>500){ey[i]=-100;ex[i]=Math.random()*260;type[i]=Math.random()<0.5?'police':'normal';s++;document.getElementById('info').innerText='Score: '+s;}
// Car banayo
if(type[i]=='police'){
c.fillStyle='blue';c.fillRect(ex[i],ey[i],40,80);
c.fillStyle='white';c.font='bold 14px Arial';c.fillText('POLICE',ex[i]+3,ey[i]+50); // YE LINE POLICE LIKHEGI
}else{
c.fillStyle='yellow';c.fillRect(ex[i],ey[i],40,80);
}
// Takkar
if(x<ex[i]+40&&x+40>ex[i]&&y<ey[i]+80&&y+80>ey[i]){alert('Game Over! Score:'+s);location.reload();}
}
requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
