<!DOCTYPE html>
<html>
<head>
<title>PRO Car Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
body{margin:0;background:#000;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden}
canvas{background:linear-gradient(#333,#000);border:3px solid cyan;border-radius:15px;box-shadow:0 0 30px cyan}
#btns{position:absolute;bottom:30px;display:flex;gap:40px}
button{width:85px;height:85px;font-size:40px;border-radius:50%;border:3px solid cyan;background:#000;color:cyan}
#nitro{border-color:orange;color:orange}
#info{position:absolute;top:20px;color:cyan;font-size:20px;font-weight:bold;text-align:center;width:100%}
#gameover{position:absolute;color:red;font-size:45px;font-weight:bold;display:none;text-align:center}
#back{position:absolute;top:20px;left:20px;background:cyan;color:black;padding:8px 12px;border-radius:8px;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<a id="back" href="index.html">← Back</a>
<div id="info">Score: 0 | Level: 1</div>
<canvas id="game" width="320" height="650"></canvas>
<div id="btns">
  <button id="left">←</button>
  <button id="nitro">N</button>
  <button id="right">→</button>
</div>
<div id="gameover">GAME OVER<br><span style="font-size:22px;color:white">Reload karo</span></div>

<!-- SOUNDS -->
<audio id="crash" src="https://www.soundjay.com/mechanical/sounds/car-crash-4.mp3"></audio>
<audio id="bg" src="https://www.soundjay.com/misc/sounds/arcade-music-loop-1.mp3" loop></audio>
<audio id="nitroSound" src="https://www.soundjay.com/mechanical/sounds/engine-rev-1.mp3"></audio>
<audio id="scoreSound" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>

<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let carX=140, score=0, level=1, gameOver=false, nitro=0, nitroActive=false;
let enemies=[{x:60,y:-100},{x:200,y:-300}], speed=4;
let particles=[];

const crash=document.getElementById('crash');
const bg=document.getElementById('bg');
const nitroS=document.getElementById('nitroSound');
const scoreS=document.getElementById('scoreSound');
bg.volume=0.15; nitroS.volume=0.4; scoreS.volume=0.3;
bg.play().catch(()=>{});

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft' && carX>15) carX-=25;
  if(e.key==='ArrowRight' && carX<265) carX+=25;
  if(e.key===' ' && nitro>0) activateNitro();
});
document.getElementById('left').ontouchstart=()=>{if(carX>15) carX-=25;};
document.getElementById('right').ontouchstart=()=>{if(carX<265) carX+=25;};
document.getElementById('nitro').ontouchstart=()=>{if(nitro>0) activateNitro();};

function activateNitro(){
  nitroActive=true; nitro--; speed+=8;
  nitroS.currentTime=0; nitroS.play(); // Nitro sound
  setTimeout(()=>{nitroActive=false; speed-=8;}, 1500);
}

function boom(x,y){
  for(let i=0;i<30;i++){
    particles.push({x:x+20,y:y+35,vx:(Math.random()-0.5)*12,vy:(Math.random()-0.5)*12,life:45,color:`hsl(${Math.random()*60},100%,60%)`});
  }
}

function drawCar(x,y,color,glow){
  ctx.shadowBlur=glow; ctx.shadowColor=color;
  ctx.fillStyle=color; ctx.fillRect(x,y,40,80);
  ctx.shadowBlur=0;
}

function updateParticles(){
  particles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.life--;
    ctx.fillStyle=p.color;
    ctx.globalAlpha=p.life/45;
    ctx.beginPath(); ctx.arc(p.x,p.y,4,0,6.28); ctx.fill();
  });
  particles=particles.filter(p=>p.life>0);
  ctx.globalAlpha=1;
}

function draw(){
  if(gameOver) return;
  ctx.clearRect(0,0,320,650);
  
  ctx.fillStyle='#fff';
  for(let i=0;i<650;i+=50) ctx.fillRect(155,i-score%50,10,25);
  
  drawCar(carX,550, nitroActive?'orange':'red', 20);
  
  enemies.forEach(e=>{
    e.y+=speed;
    if(e.y>650){
      e.y=-100-Math.random()*200; 
      e.x=Math.random()*270+15; 
      score++;
      scoreS.currentTime=0; scoreS.play(); // Score sound
      if(score%5==0){level++; speed+=1;}
      if(Math.random()<0.3) nitro++; // Nitro milta rahega
    }
    let color = e.x<100 ? 'blue' : 'yellow'; // Police = blue
    drawCar(e.x,e.y,color,15);
    
    if(carX<e.x+40 && carX+40>e.x && 550<e.y+80 && 550+80>e.y){
      gameOver=true; boom(e.x,e.y); crash.play(); bg.pause();
      document.getElementById('gameover').style.display='block';
    }
  });
  
  updateParticles();
  
  document.getElementById('info').innerText=`Score: ${score} | Level: ${level} | Nitro: ${nitro}`;
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
