 <!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game</title>
<style>
body{margin:0;background:black;overflow:hidden;-webkit-user-select:none;user-select:none}
#back{position:absolute;top:10px;left:10px;z-index:999;background:cyan;color:black;padding:10px;border-radius:5px;text-decoration:none;font-weight:bold}
canvas{display:block;margin:70px auto 0;border:2px solid cyan;background:#111}
#btns{position:absolute;bottom:30px;width:100%;text-align:center}
button{width:80px;height:80px;margin:0 25px;font-size:35px;border-radius:50%;background:#222;color:cyan;border:2px solid cyan}
</style>
</head>
<body>
<a id="back" href="index.html">Back</a>
<canvas id="game" width="300" height="500"></canvas>
<div id="btns">
<button id="left">←</button>
<button id="right">→</button>
</div>

<script>
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var playerX = 130;
var score = 0;
var cars = [{x:60, y:-100, t:1}, {x:200, y:-300, t:2}];

function draw() {
  ctx.clearRect(0,0,300,500);

  // road line
  ctx.fillStyle = 'white';
  for(var i=0; i<500; i+=40){
    ctx.fillRect(145, i, 10, 20);
  }

  // player car red
  ctx.fillStyle = 'red';
  ctx.fillRect(playerX, 420, 40, 80);

  // enemy cars
  for(var i=0; i<2; i++){
    cars[i].y = cars[i].y + 4;
    if(cars[i].y > 500){
      cars[i].y = -100;
      cars[i].x = Math.random() * 260;
      score++;
    }

    if(cars[i].t == 1){
      ctx.fillStyle = 'blue';
      ctx.fillRect(cars[i].x, cars[i].y, 40, 80);
      ctx.fillStyle = 'white';
      ctx.font = '14px Arial';
      ctx.fillText('POLICE', cars[i].x + 5, cars[i].y + 50);
    } else {
      ctx.fillStyle = 'yellow';
      ctx.fillRect(cars[i].x, cars[i].y, 40, 80);
    }

    // takkar
    if(playerX < cars[i].x + 40 && playerX + 40 > cars[i].x && 420 < cars[i].y + 80 && 420 + 80 > cars[i].y){
      alert('Game Over! Score: ' + score);
      location.reload();
    }
  }
  requestAnimationFrame(draw);
}

document.getElementById('left').onclick = function(){ if(playerX > 10) playerX = playerX - 25; }
document.getElementById('right').onclick = function(){ if(playerX < 250) playerX = playerX + 25; }

draw();
</script>
</body>
</html>
