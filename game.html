 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Game</title>
<style>
body{margin:0;background:#000;overflow:hidden}
#back{position:absolute;top:10px;left:10px;z-index:100;background:#00ffff;color:#000;padding:10px;text-decoration:none;border-radius:5px;font-weight:bold}
canvas{display:block;margin:60px auto 0;border:2px solid cyan}
#btns{position:absolute;bottom:20px;width:100%;text-align:center}
button{width:80px;height:80px;margin:0 20px;font-size:30px;border-radius:50%;background:#222;color:cyan;border:2px solid cyan}
</style>
</head>
<body>
<a id="back" href="index.html">Back</a>
<canvas id="game" width="300" height="500"></canvas>
<div id="btns">
<button id="left">←</button>
<button id="right">→</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let playerX = 130;
let score = 0;
let cars = [
  {x:60, y:-100, type:'police'},
  {x:200, y:-300, type:'normal'}
];

function drawPlayer() {
  ctx.fillStyle = 'red';
  ctx.fillRect(playerX, 420, 40, 80);
}

function drawCar(car) {
  if(car.type === 'police'){
    ctx.fillStyle = 'blue';
    ctx.fillRect(car.x, car.y, 40, 80);
    ctx.fillStyle = 'white';
    ctx.font = '14px Arial';
    ctx.fillText('POLICE', car.x + 3, car.y + 50);
  } else {
    ctx.fillStyle = 'yellow';
    ctx.fillRect(car.x, car.y, 40, 80);
  }
}

function update() {
  ctx.clearRect(0,0,300,500);

  // Road
  ctx.fillStyle = 'white';
  for(let i=0; i<500; i+=40){
    ctx.fillRect(145, i, 10, 20);
  }

  drawPlayer();

  for(let i=0; i<cars.length; i++){
    cars[i].y += 4;
    if(cars[i].y > 500){
      cars[i].y = -100;
      cars[i].x = Math.random() * 260;
      score++;
    }
    drawCar(cars[i]);

    // Collision
    if(playerX < cars[i].x + 40 && playerX + 40 > cars[i].x && 420 < cars[i].y + 80 && 420 + 80 > cars[i].y){
      alert('Game Over! Score: ' + score);
      location.reload();
    }
  }
  requestAnimationFrame(update);
}

// Controls
document.getElementById('left').onclick = () => { playerX -= 20; }
document.getElementById('right').onclick = () => { playerX += 20; }
document.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowLeft') playerX -= 20;
  if(e.key === 'ArrowRight') playerX += 20;
});

update();
</script>
</body>
</html>
